services:
  - type: web
    name: flight-log-reviewer-map
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flightrecorder dashboard --host 0.0.0.0 --no-browser
    healthCheckPath: /
    envVars:
      - key: MAX_UPLOAD_MB
        value: "200"
